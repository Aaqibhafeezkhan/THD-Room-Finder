name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Workflow script tests
        run: node --test .github/scripts/*.checks.cjs
      - run: npm run build

  android:
    name: Android — build debug APK (Capacitor)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      # The job name is a required check; unit tests run in the same step.
      - name: Native unit tests and debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      # "Room Finder test" installs next to the real app, for trying a PR on
      # a phone before a release.
      - name: Attach the test APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: room-finder-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
