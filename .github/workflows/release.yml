name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build web + signed Android APK, publish release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "::error::Release tag must start with v"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve version
        id: version
        run: echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The focus service's public URL and publishable key (repository
      # variables, not secrets: both ship in the app). Without them the APK
      # builds device-only, with no sign-in, so a release must fail instead.
      - name: Build web bundle
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY repository variables are required"
            exit 1
          fi
          npm run build

      # Live updates (#113): the same web build as a zip, plus the native
      # fingerprint it was built against (computed before cap sync, like the
      # value built into the app).
      - name: Package web bundle
        id: bundle
        run: |
          echo "fingerprint=$(node scripts/release/nativeFingerprint.mjs)" >> "$GITHUB_OUTPUT"
          mkdir -p dist-apk
          (cd dist && zip -qr "../dist-apk/web-${{ steps.version.outputs.value }}.zip" .)

      - name: Sync web assets into Android project
        run: npx cap sync android

      # Signing material is never committed. Recreate release.keystore from a
      # base64 secret and write android/keystore.properties from secrets. A
      # release must fail rather than silently publishing an unsigned APK.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::$variable is not configured"
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          cat > android/keystore.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Assemble release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist-apk/thd-room-finder-${{ steps.version.outputs.value }}.apk"

      # What installed apps read from releases/latest/download/update.json.
      - name: Write update manifest
        run: |
          node scripts/release/updateManifest.mjs "$RELEASE_TAG" "${{ steps.bundle.outputs.fingerprint }}" \
            "dist-apk/web-${{ steps.version.outputs.value }}.zip" \
            "dist-apk/thd-room-finder-${{ steps.version.outputs.value }}.apk" > dist-apk/update.json
          cat dist-apk/update.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist-apk/*.apk
            dist-apk/*.zip
            dist-apk/update.json
          generate_release_notes: true
