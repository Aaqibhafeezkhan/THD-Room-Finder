<!-- @dsCard group="Components" viewport="700x420" name="Room Finder — App Components" subtitle="App bar, room cards, status banner, and the brand mark in context" -->
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--font-sans); background: var(--md-bg); padding: 0; }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .full { grid-column: 1 / -1; border-radius: var(--radius-l); overflow: hidden; box-shadow: var(--md-shadow-1); }
  .lbl { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; color: var(--md-on-surface-variant); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { AppBar, RoomCard, StatusCard, IconButton } = window.THDRoomFinderDesignSystem_de229b;
  const Heart = () => <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.8 4.6c-1.7-1.7-4.5-1.6-6.1.2L12 7.6 9.3 4.8C7.7 3 4.9 2.9 3.2 4.6c-1.8 1.8-1.8 4.7 0 6.5L12 20l8.8-8.9c1.8-1.8 1.8-4.7 0-6.5z"/></svg>;
  function Demo() {
    return (
      <div className="wrap">
        <div className="full">
          <AppBar mode="brand" actions={<IconButton label="Sponsor" tone="sponsor"><Heart/></IconButton>} />
        </div>
        <div className="full">
          <AppBar mode="back" title="A.011 — Lecture Hall" onBack={()=>{}} />
        </div>
        <div className="col">
          <span className="lbl">Room cards — duration-first</span>
          <RoomCard name="B.204" meta="Building B · 45 seats" status="free" duration="2h 10m" />
          <RoomCard name="ITC1.07" meta="ITC · 24 seats" status="free" duration="all day" />
          <RoomCard name="J.213" meta="Building J · 30 seats" status="soon" duration="25m" />
        </div>
        <div className="col">
          <span className="lbl">Status banners</span>
          <StatusCard status="free" title="Free now" sub="Free until 16:45" duration="2h 10m" />
          <StatusCard status="soon" title="Closing soon" sub="Free until 12:15" duration="25m" />
          <StatusCard status="occupied" title="Occupied now" sub="Occupied until 11:30" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
