<!-- @dsCard group="Components" viewport="700x380" name="Buttons, Chips & Badges" subtitle="M3 pill buttons, filter chips, status badges, icon buttons, language toggle" -->
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--font-sans); background: var(--md-bg); padding: 20px 24px; }
  .group { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .lbl { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; color: var(--md-on-surface-variant); width: 100%; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Button, Chip, Badge, IconButton, LanguageToggle } = window.THDRoomFinderDesignSystem_de229b;
  const Heart = () => <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.8 4.6c-1.7-1.7-4.5-1.6-6.1.2L12 7.6 9.3 4.8C7.7 3 4.9 2.9 3.2 4.6c-1.8 1.8-1.8 4.7 0 6.5L12 20l8.8-8.9c1.8-1.8 1.8-4.7 0-6.5z"/></svg>;
  const Pin = () => <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>;
  function Demo() {
    const [b, setB] = React.useState('A');
    const [lang, setLang] = React.useState('en');
    return (
      <div className="group">
        <div className="row"><span className="lbl">Language toggle</span>
          <LanguageToggle value={lang} onChange={setLang} size="small" />
          <LanguageToggle value={lang} onChange={setLang} size="medium" />
        </div>
        <div className="row"><span className="lbl">Buttons</span>
          <Button variant="filled" icon={<Pin/>}>Find a Free Room</Button>
          <Button variant="tonal">Refresh</Button>
          <Button variant="outlined">View Source</Button>
          <Button variant="text">Reset</Button>
          <Button variant="filled" disabled>Disabled</Button>
        </div>
        <div className="row"><span className="lbl">Filter chips</span>
          {['All','A','B','ITC','J'].map(x => <Chip key={x} active={b===x} onClick={()=>setB(x)}>{x}</Chip>)}
        </div>
        <div className="row"><span className="lbl">Badges</span>
          <Badge tone="free">Until 14:00</Badge>
          <Badge tone="allday">All day</Badge>
          <Badge tone="occupied">Occupied now</Badge>
          <Badge tone="neutral">60 seats</Badge>
        </div>
        <div className="row"><span className="lbl">Icon buttons</span>
          <IconButton label="Sponsor" tone="sponsor"><Heart/></IconButton>
          <IconButton label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 18l-6-6 6-6"/></svg></IconButton>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
