<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--font-sans); background: var(--md-surface); padding: 24px; display: flex; align-items: center; gap: 32px; }
  .icons { display: flex; align-items: center; gap: 20px; }
  .icons img { display: block; }
  .lockup { display: flex; align-items: center; gap: 12px; }
  .lockup img { width: 36px; height: 36px; border-radius: 8px; }
  .word { font-size: 1.375rem; font-weight: 500; color: var(--md-on-surface); }
  .note { font-size: 13px; color: var(--md-on-surface-variant); line-height: 1.55; max-width: 300px; }
</style>
</head>
<body>
  <div class="icons">
    <img src="../assets/logo/icon-512.png" width="96" height="96" alt="App icon" style="border-radius:22px; box-shadow:var(--md-shadow-2);">
    <img src="../assets/logo/icon-192.png" width="56" height="56" alt="App icon small" style="border-radius:13px;">
  </div>
  <div>
    <div class="lockup">
      <img src="../assets/logo/icon.svg" alt="">
      <span class="word">THD Room Finder</span>
    </div>
    <p class="note" style="margin-top:14px;">An open door with green light spilling out — "find a <em>free</em> room." White on THD blue (#1565C0), the green (#4FD0A0) carries the app's "available" signal. Squircle on mobile; the horizontal lockup pairs the mark with the wordmark in Roboto Medium.</p>
  </div>
</body>
</html>
