<!-- @dsCard group="Colors" viewport="700x150" name="Sponsor — Pink" subtitle="Reserved exclusively for the 'help launch iOS' funding CTA. Never decorative." -->
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--font-sans); background: var(--md-bg); padding: 20px; display: flex; align-items: center; gap: 16px; }
  .sw { width: 150px; border-radius: var(--radius-m); padding: 14px; display: flex; flex-direction: column; gap: 24px; min-height: 96px; box-shadow: var(--md-shadow-1); }
  .name { font-size: 13px; font-weight: 500; }
  .hex { font-family: var(--font-mono); font-size: 12px; opacity: 0.85; }
  .note { font-size: 13px; color: var(--md-on-surface-variant); line-height: 1.5; max-width: 360px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: var(--sponsor); color: #fff; font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: var(--radius-xl); }
</style>
</head>
<body>
  <div class="sw" style="background: var(--sponsor-container); color: var(--sponsor);">
    <span class="name">Sponsor</span>
    <span class="hex">#D81B60</span>
  </div>
  <div>
    <span class="pill">♥ Help launch iOS</span>
    <p class="note" style="margin-top:12px;">Pink appears only on the one-time sponsorship call-to-action. It is intentionally outside the Material role palette so it never reads as a primary product action.</p>
  </div>
</body>
</html>
