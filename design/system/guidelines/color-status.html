<!-- @dsCard group="Colors" viewport="700x210" name="Status — Free · Closing · Occupied" subtitle="The app's core signal. Green = free, amber = closing soon, red = occupied." -->
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--font-sans); background: var(--md-bg); padding: 20px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .sw { flex: 1; min-width: 150px; border-radius: var(--radius-m); padding: 14px; box-shadow: var(--md-shadow-1); display: flex; flex-direction: column; gap: 22px; min-height: 120px; }
  .name { font-size: 13px; font-weight: 500; }
  .dur { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 400; line-height: 1; }
  .hex { font-family: var(--font-mono); font-size: 11px; opacity: 0.8; margin-top: 4px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--md-tertiary-container); color: var(--md-on-tertiary-container);">
      <span class="name">Free</span>
      <div><div class="dur">2h 10m</div><div class="hex">tertiary · #00796B</div></div>
    </div>
    <div class="sw" style="background: var(--md-warning-container); color: var(--md-on-warning-container);">
      <span class="name">Closing soon</span>
      <div><div class="dur">25m</div><div class="hex">warning · #9A6700</div></div>
    </div>
    <div class="sw" style="background: var(--md-error-container); color: var(--md-on-error-container);">
      <span class="name">Occupied</span>
      <div><div class="dur">until 11:30</div><div class="hex">error · #B3261E</div></div>
    </div>
  </div>
</body>
</html>
