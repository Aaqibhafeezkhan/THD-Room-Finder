<!-- @dsCard group="Focus" viewport="700x320" name="Campus map — focus signals" subtitle="Availability tint stays; your batch adds a violet ring + count, claims add a dark-purple dot. Lectures are never recoloured. Options for design session D3." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--font-sans); background: var(--md-bg); color: var(--md-on-surface); padding: 16px; display: flex; gap: 18px; align-items: center; }
  svg { background: var(--md-surface); border-radius: var(--radius-l); box-shadow: var(--md-shadow-1); flex: none; }
  .legend { display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
  .k { display: flex; align-items: center; gap: 10px; }
  .sq { width: 18px; height: 14px; border-radius: 3px; flex: none; }
  text { font-family: var(--font-mono); font-size: 12px; font-weight: 500; }
</style>
</head>
<body>
  <svg width="400" height="280" viewBox="0 0 400 280" role="img" aria-label="Four campus buildings with focus signals">
    <!-- Building A: lecture-heavy, mostly occupied -->
    <polygon points="30,170 120,170 120,240 30,240" style="fill: var(--md-error-container); stroke: var(--md-error);" stroke-width="1.5"/>
    <text x="68" y="210" style="fill: var(--md-on-error-container);">A</text>
    <!-- Building C: free, one claim -->
    <polygon points="150,150 250,150 250,240 150,240" style="fill: var(--md-tertiary-container); stroke: var(--md-tertiary);" stroke-width="1.5"/>
    <text x="194" y="200" style="fill: var(--md-on-tertiary-container);">C</text>
    <circle cx="242" cy="158" r="10" style="fill: var(--md-claimed);"/>
    <text x="238" y="162" style="fill: var(--md-on-claimed); font-size: 11px;">1</text>
    <!-- Building E: free, your batch is here -->
    <polygon points="60,40 190,40 190,130 60,130" style="fill: var(--md-tertiary-container); stroke: var(--md-focus);" stroke-width="4"/>
    <text x="118" y="92" style="fill: var(--md-on-tertiary-container);">E</text>
    <g>
      <rect x="160" y="26" width="64" height="24" rx="12" style="fill: var(--md-focus);"/>
      <text x="170" y="42" style="fill: var(--md-on-focus); font-size: 11px;">AIN 7·2</text>
    </g>
    <!-- Building I: free, quiet -->
    <polygon points="250,40 370,40 370,120 250,120" style="fill: var(--md-tertiary-container); stroke: var(--md-tertiary);" stroke-width="1.5"/>
    <text x="305" y="86" style="fill: var(--md-on-tertiary-container);">I</text>
  </svg>
  <div class="legend">
    <span class="k"><span class="sq" style="background: var(--md-tertiary-container); box-shadow: inset 0 0 0 1.5px var(--md-tertiary);"></span>Free rooms (tint = share of free rooms)</span>
    <span class="k"><span class="sq" style="background: var(--md-error-container); box-shadow: inset 0 0 0 1.5px var(--md-error);"></span>Mostly lectures</span>
    <span class="k"><span class="sq" style="background: var(--md-tertiary-container); box-shadow: inset 0 0 0 3px var(--md-focus);"></span>Your batch is studying here (ring + count)</span>
    <span class="k"><span class="sq" style="background: var(--md-claimed); border-radius: 50%; width: 14px;"></span>Claimed by a focus session (count)</span>
    <span style="font-size: 12px; color: var(--md-on-surface-variant); max-width: 230px;">Every signal is also in the building's room list. Option to explore in D3: a full violet fill for batch buildings when no room there has a lecture.</span>
  </div>
</body>
</html>
