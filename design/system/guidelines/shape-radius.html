<!-- @dsCard group="Spacing" viewport="700x180" name="Shape — Corner Radius" subtitle="xs badges · s chips/inputs · l cards · xl pill buttons" -->
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--font-sans); background: var(--md-surface); padding: 20px 24px; }
  .row { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 76px; height: 64px; background: var(--md-primary-container); border: 1px solid var(--md-primary); }
  .n { font-size: 12px; font-weight: 500; color: var(--md-on-surface); }
  .v { font-family: var(--font-mono); font-size: 11px; color: var(--md-on-surface-variant); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-xs);"></div><span class="n">xs</span><span class="v">4px · badge</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-s);"></div><span class="n">s</span><span class="v">8px · chip</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-m);"></div><span class="n">m</span><span class="v">12px · tile</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-l);"></div><span class="n">l</span><span class="v">16px · card</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl);"></div><span class="n">xl</span><span class="v">28px · button</span></div>
  </div>
</body>
</html>
