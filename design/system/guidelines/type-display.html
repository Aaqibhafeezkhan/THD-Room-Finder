<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--font-sans); background: var(--md-surface); padding: 16px 24px; display: flex; align-items: center; gap: 28px; }
  .num { font-size: 7rem; font-weight: 300; line-height: 1; color: var(--md-primary); letter-spacing: 0; }
  .meta { display: flex; flex-direction: column; gap: 4px; }
  .label { font-size: 1rem; font-weight: 500; color: var(--md-on-surface); }
  .sub { font-size: 0.875rem; color: var(--md-on-surface-variant); }
  .spec { font-family: var(--font-mono); font-size: 12px; color: var(--md-on-surface-variant); margin-top: 8px; }
</style>
</head>
<body>
  <div class="num">42</div>
  <div class="meta">
    <span class="label">rooms available right now</span>
    <span class="sub">out of 289 total rooms</span>
    <span class="spec">Roboto · 300 · 112px / 1.0</span>
  </div>
</body>
</html>
