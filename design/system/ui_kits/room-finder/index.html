<!-- @startingPoint section="Room Finder" subtitle="Responsive room-finder: 2.5D map → building → free-room list → detail (mobile/tablet/desktop, M3 dynamic color)" viewport="1220x880" -->
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THD Room Finder — App UI Kit</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font-sans); background: var(--md-bg); }
  #root { height: 100vh; }
  /* the M3 device frame ships a green default surface; force our palette */
  #root [style*="f4fbf8"] { background: var(--md-bg) !important; }
  /* hide scrollbars everywhere (scroll still works) */
  #root *::-webkit-scrollbar { width: 0; height: 0; display: none; }
  #root * { scrollbar-width: none; -ms-overflow-style: none; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<!-- shared campus + rooms data (single source of truth across cards/templates) -->
<script src="../../components/app/CampusMap/campus-data.js"></script>
<script src="../../components/app/CampusMap/context-data.js"></script>
<script src="../../templates/campus-room-finder/rooms-data.js"></script>
<script type="text/babel" src="android-frame.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('root')).render(<window.RoomFinderApp/>);
</script>
</body>
</html>
